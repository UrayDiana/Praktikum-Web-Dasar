<html>
    <head>
        <title>Atribut dari Tag Font</title>
    </head>
        <body>
            <p align="center"><font face="Arial">Ini Font Arial</font></p>
            <p align="center"><font face="Arial"><b>Ini Font Arial, miring, dan tebal</b></font></p>
            <p><font face="Verdana" size="6" color="blue"><b>Ini Font Verdana berukuran 6, biru, dan tebal</b></font></p>
            <p align="center"><font face="Tahoma" color="green"><b>Ini Font Tahoma hijau, tebal, dan di tengah</b></font></p>
            <p align="center"><font face="Arial" color="red">Ini Font Arial merah, </font>
            <font face="Verdana" color="blue">ini Font Verdana biru</font></p>
        </body>
</html>
